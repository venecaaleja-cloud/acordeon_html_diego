<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>acordeon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--contenedor principal con borde-->

  <!-- Esta es la caja blanca principal con el borde -->
    <div class="contenedor-acordeon">
        
        <!-- El encabezado de la página -->
        <h1>Preguntas Frecuentes</h1>
        <p class="subtitulo">Aquí hay algunas de las preguntas más comunes</p>

        <!-- ÍTEM 1: Pregunta y Respuesta -->
        <div class="item-acordeon">
            <!-- El botón es la parte negra que se hace clic -->
            <button class="cabecera-acordeon">
                soy diego
                <span class="icono">v</span> <!-- La flechita -->
            </button>
            <!-- Este div contiene el texto que se oculta/muestra -->
            <div class="contenido-acordeon">
                <p>o alejandro</p>
            </div>
        </div>

        <!--ITEM 2-->
        <div class="item-acordeon">
            <button class="cabecera-acordeon">
                cuales son los planes
                <span class="icono">v</span>
            </button>
            <div class="contenido-acordeon">
                <p>seguir creando contenido</p>
            </div>
        </div>

        <!--ITEM 3-->
        <div class="item-acordeon">
            <button class="cabecera-acordeon">
                como esta contruido
                <span class="icono">v</span>
            </button>
            <div class="contenido-acordeon">
                <p>esta contruido con</p>
            </div>
        </div>

        <!--ITEM 4-->

        <div class="item-acordeon">
            <button class="cabecera-acordeon">
                puede usar
                <span class="icono">v</span>
            </button>
            <div class="contenido-acordeon">
                <p> si puede usarlo</p>
            </div>
        </div>

        <!--conectamos lo que es pa de java.js-->
        <script src="java.js"></script>

</body>
</html>
